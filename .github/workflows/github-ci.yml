name: Deploy my-react-app
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Start Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install modules
        run: npm install
      - name: Build production project
        run: npm run build:prod
      - name: Linting typescript
        run: npm run lint:ts
      - name: Linting css
        run: npm run lint:scss
      - name: Unit testing
        run: npm run test:unit
      - name: Screenshot testing
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: storybook:build
  deploy:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        node: [22.x]
    steps: 
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/archimeister757/my-react-app:latest \
            .
      - name: Push Docker image
        run: |
          docker push ghcr.io/archimeister757/my-react-app:latest
      - name: Deploy to VPS
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            docker pull ghcr.io/archimeister757/my-react-app:latest

            docker stop my-react-app || true
            docker rm my-react-app || true

            docker run -d \
              --name my-react-app \
              --restart unless-stopped \
              -p 80:80 \
              ghcr.io/archimeister757/my-react-app:latest